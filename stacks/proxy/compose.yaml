# Reverse proxy stack on the Chromebook.
# Lives at /opt/stacks/proxy. Copy it to the server with scp.
# The Cloudflare DNS token is NOT in this repo: it is written to
# /opt/stacks/proxy/secrets/cf_dns_token (chmod 600) straight from 1Password.

name: proxy

services:
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # lego (Traefik's ACME client) reads the token from this file
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_dns_token
    secrets:
      - cf_dns_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./conf.d:/etc/traefik/conf.d:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

  # Cloudflare Tunnel (remotely managed, tunnel "chromebook"). Dials out to Cloudflare,
  # so no router ports are opened. Public hostnames are set in the Cloudflare dashboard
  # and point at https://traefik:443 with Match SNI to Host.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: cloudflared
    restart: unless-stopped
    user: "1000:1000"   # your-user, so it can read the chmod 600 token file
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cf_tunnel_token
    secrets:
      - cf_tunnel_token
    networks:
      - proxy
    depends_on:
      - traefik

  # Test app: answers on https://hello.example.com with request details
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.hello.rule=Host(`hello.example.com`)
      - traefik.http.routers.hello.entrypoints=websecure

networks:
  proxy:
    name: proxy

secrets:
  cf_dns_token:
    file: ./secrets/cf_dns_token
  cf_tunnel_token:
    file: ./secrets/cf_tunnel_token
